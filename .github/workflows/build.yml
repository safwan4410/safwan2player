name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3"
          python -m pip install --upgrade buildozer
          python -m pip install --upgrade python-for-android

      - name: Show versions
        run: |
          python --version
          buildozer --version
          p4a --version

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show important errors
        if: always()
        run: |
          echo "======================================"
          echo "IMPORTANT BUILD MESSAGES"
          echo "======================================"

          grep -Ei \
            "error:|error |exception|failed|fatal|traceback|could not|not found" \
            build.log \
            | tail -n 150 \
            || true

          echo "======================================"
          echo "LAST 100 LINES"
          echo "======================================"

          tail -n 100 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Check APK
        if: always()
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoloForge-APK
          path: bin/*.apk
