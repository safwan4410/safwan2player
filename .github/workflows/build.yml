```yaml
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install "cython==0.29.36"
        python -m pip install --upgrade buildozer

    - name: Prepare Android SDK
      run: |
        echo "Accepting Android SDK licenses..."

        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

        echo "Installing Android SDK packages..."

        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0"

    - name: Build APK
      id: build
      continue-on-error: true
      run: |
        echo "======================================"
        echo "STARTING BUILD"
        echo "======================================"

        buildozer -v android debug 2>&1 | tee build.log

        BUILD_EXIT=${PIPESTATUS[0]}

        echo "Buildozer exit code: $BUILD_EXIT"

        exit $BUILD_EXIT

    - name: Show build errors
      if: always()
      run: |
        echo "======================================"
        echo "IMPORTANT BUILD MESSAGES"
        echo "======================================"

        grep -Ei \
          "error:|error |exception|failed|fatal|traceback|could not|not found|BUILD FAILED" \
          build.log \
          | tail -n 200 \
          || true

        echo "======================================"
        echo "LAST 100 LINES"
        echo "======================================"

        tail -n 100 build.log

    - name: Check APK
      if: always()
      run: |
        echo "======================================"
        echo "SEARCHING FOR APK"
        echo "======================================"

        find . -type f -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true

        echo "======================================"

        if find bin -type f -name "*.apk" | grep -q .; then
          echo "APK FOUND!"
        else
          echo "NO APK FOUND!"
          exit 1
        fi

    - name: Upload APK
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: SoloForge-APK
        path: bin/*.apk
        if-no-files-found: error

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn
```
