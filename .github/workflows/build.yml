
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.36"
          python -m pip install --upgrade buildozer

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          buildozer -v android debug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Find APK
        id: find_apk
        if: always()
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find . -type f -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "NO APK FOUND!"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p bin
          cp "$APK" bin/SoloForge.apk

          echo "APK copied to:"
          ls -lh bin/SoloForge.apk

      - name: Show build errors
        if: always()
        run: |
          echo "======================================"
          echo "IMPORTANT BUILD MESSAGES"
          echo "======================================"

          if [ -f build.log ]; then
            grep -Ei "error:|error |exception|failed|fatal|traceback|could not|not found|BUILD FAILED" build.log | tail -n 200 || true

            echo "======================================"
            echo "LAST 100 LINES"
            echo "======================================"

            tail -n 100 build.log
          fi

      - name: Upload APK
        if: steps.find_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SoloForge-APK
          path: bin/SoloForge.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
